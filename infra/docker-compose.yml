services:
  postgres:
    image: postgres:16-alpine
    container_name: akilli_postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - akilli_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: akilli_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ../data:/app/data:ro

  mlflow:
    build:
      context: ./mlflow
      dockerfile: Dockerfile
    container_name: akilli_mlflow
    restart: unless-stopped
    ports:
      - "5050:5000"
    volumes:
      - akilli_mlflow_data:/mlflow

  minio:
    image: minio/minio:latest
    container_name: akilli_minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - akilli_minio_data:/data

volumes:
  akilli_pgdata:
  akilli_mlflow_data:
  akilli_minio_data:
